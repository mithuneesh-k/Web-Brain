<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 250px);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin: 0;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .input-container {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-container:focus-within {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      padding: 0;
      min-height: 60px;
    }
    textarea::placeholder {
      color: var(--text-muted);
    }
    .action-row {
      display: flex;
      justify-content: flex-end;
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .loader {
      display: none;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result-container {
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      animation: slideUp 0.3s ease forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Ozer</h1>
    <div class="status-dot" title="Ready"></div>
  </div>
  
  <div class="input-container">
    <textarea id="prompt" placeholder="What should I do on this page?" spellcheck="false"></textarea>
    <div class="action-row">
      <button id="runBtn">
        <span id="btnText">Execute</span>
        <div class="loader" id="loader"></div>
      </button>
    </div>
  </div>

  <div class="result-container" id="resultContainer"></div>

  <script src="popup.js"></script>
</body>
</html>
